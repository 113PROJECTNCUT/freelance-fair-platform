# 選用：有 Docker 的話，docker compose up -d 就有一個 MySQL 可用
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fairgig
      MYSQL_USER: fairgig
      MYSQL_PASSWORD: fairgig123
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Taipei
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
